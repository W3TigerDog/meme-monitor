<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A real-time Solana meme-token signal dashboard powered by DexScreener market data." />
  <meta name="theme-color" content="#07110c" />
  <meta property="og:title" content="Meme Monitor Signal Desk" />
  <meta property="og:description" content="Track liquidity, order flow, valuation, and short-term momentum in one live Solana signal feed." />
  <meta property="og:type" content="website" />
  <title>Meme Monitor · Live Signal Desk</title>
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <h2 id="title">Meme Monitor Dashboard</h2>

  <div class="clockbar">
    <div class="clk"><span class="label">ET</span><span id="clockET" class="time muted">--:--:--</span></div>
    <div class="clk"><span class="label">MT</span><span id="clockMT" class="time muted">--:--:--</span></div>
    <div class="clk"><span class="label">PT</span><span id="clockPT" class="time muted">--:--:--</span></div>
  </div>

  <div class="row" aria-label="Signal filters">
    <label>Minimum score
      <input id="minScore" type="number" value="3" min="0" max="10" inputmode="numeric" />
    </label>
    <label>Keyword
      <input id="kw" type="text" placeholder="dog, cat, pepe" autocomplete="off" />
    </label>
    <label>Age window
      <span class="input-unit"><input id="ageWindow" type="number" value="10" min="1" max="240" inputmode="numeric" /><span>min</span></span>
    </label>
    <label>Alert score
      <input id="alertScore" type="number" value="5" min="0" max="10" inputmode="numeric" />
    </label>
    <label>Sort signals
      <select id="sortBy">
        <option value="newest">Newest first</option>
        <option value="score">Highest score</option>
        <option value="liquidity">Highest liquidity</option>
        <option value="volume">Highest volume</option>
        <option value="pairAge">Newest pair</option>
      </select>
    </label>
    <label class="toggle"><input id="soundOn" type="checkbox" /> Sound alerts</label>
    <label class="toggle"><input id="compactMode" type="checkbox" /> Compact cards</label>
    <button id="clear" type="button">Clear view</button>
    <button id="undo" type="button" hidden>Undo clear</button>
    <span class="muted" id="status">Connecting…</span>
  </div>

  <div class="muted">Preferences are saved on this device. Sound remains off until you enable it.</div>
  <div class="muted">Showing signals received within <strong><span id="ageWindowLabel">10</span> minutes</strong>.</div>

  <div id="list"></div>
  <noscript>This dashboard requires JavaScript for live signals and filtering.</noscript>

  <script src="./dashboard-shell.js"></script>
  <script src="./dashboard-logic.js"></script>
  <script src="./dashboard-app.js"></script>
</body>
</html>
